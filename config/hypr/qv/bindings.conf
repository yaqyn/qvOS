# qvOS keybinding overrides.

# Remove inherited Omarchy application shortcuts. System controls remain
# upstream-owned; qvOS defines its intentional application families below.
unbind = SUPER ALT, RETURN
unbind = SUPER SHIFT, RETURN
unbind = SUPER SHIFT, F
unbind = SUPER SHIFT ALT, F
unbind = SUPER SHIFT, B
unbind = SUPER SHIFT ALT, B
unbind = SUPER SHIFT, M
unbind = SUPER SHIFT ALT, M
unbind = SUPER SHIFT, N
unbind = SUPER SHIFT, D
unbind = SUPER SHIFT, G
unbind = SUPER SHIFT, O
unbind = SUPER SHIFT, W
unbind = SUPER SHIFT, SLASH
unbind = SUPER SHIFT, A
unbind = SUPER SHIFT ALT, A
unbind = SUPER SHIFT, C
unbind = SUPER SHIFT, E
unbind = SUPER SHIFT, Y
unbind = SUPER SHIFT ALT, G
unbind = SUPER SHIFT CTRL, G
unbind = SUPER SHIFT, P
unbind = SUPER SHIFT, X
unbind = SUPER SHIFT ALT, X

# Terminal family.
unbind = SUPER, RETURN
bindd = SUPER, RETURN, Terminal, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here terminal
bindd = SUPER CTRL, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/share/qvos/hyprland/qvos-tmux last
bindd = SUPER SHIFT CTRL, RETURN, Tmux manager, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/share/qvos/hyprland/qvos-tmux manager

# Proton apps, ordered by key-depth frequency (0-1 only).
unbind = SUPER, P
bindd = SUPER, M, Proton Mail, exec, omarchy-launch-webapp "https://mail.proton.me"
bindd = SUPER SHIFT, M, Proton Meet, exec, omarchy-launch-webapp "https://meet.proton.me"
bindd = SUPER, D, Proton Drive, exec, omarchy-launch-webapp "https://drive.proton.me"
bindd = SUPER SHIFT, D, Proton Docs, exec, omarchy-launch-webapp "https://docs.proton.me"
bindd = SUPER, P, Proton Pass, exec, omarchy-launch-webapp "https://pass.proton.me"
bindd = SUPER SHIFT, C, Proton Calendar, exec, omarchy-launch-webapp "https://calendar.proton.me"
bindd = SUPER SHIFT, W, Proton Wallet, exec, omarchy-launch-webapp "https://wallet.proton.me"

# Daily developer apps.
unbind = SUPER, A
unbind = SUPER SHIFT, A
unbind = SUPER CTRL, A
unbind = SUPER SHIFT CTRL, A
unbind = SUPER ALT, A
unbind = SUPER SHIFT ALT, A
unbind = SUPER CTRL ALT, A
unbind = SUPER SHIFT CTRL ALT, A
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Lumo, exec, omarchy-launch-webapp "https://lumo.proton.me"
bindd = SUPER CTRL, A, Codex YOLO, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here codex-yolo "$HOME"
bindd = SUPER SHIFT CTRL, A, Codex YOLO here, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here codex-yolo

# File manager family.
bindd = SUPER, E, Thunar, exec, uwsm-app -- ~/.local/share/qvos/defaults/qvos-launch-thunar "$HOME"
bindd = SUPER SHIFT, E, Thunar here, exec, uwsm-app -- ~/.local/share/qvos/defaults/qvos-launch-thunar "$(~/.local/share/qvos/hyprland/qvos-active-location)"

# Browser family.
bindd = SUPER, B, Brave Origin, exec, omarchy-launch-browser
bindd = SUPER SHIFT, B, Brave Origin private, exec, omarchy-launch-browser --private

# Development tools.
bindd = SUPER ALT, L, Localhost, exec, ~/.local/share/qvos/hyprland/qvos-localhost-open

# Special workspace.
unbind = SUPER, S
bindd = SUPER CTRL ALT, S, Toggle special workspace, togglespecialworkspace, scratchpad
bindd = SUPER SHIFT CTRL ALT, S, Move window in or out of special workspace, exec, ~/.local/share/qvos/hyprland/qvos-toggle-special-window

# Disable every silent workspace move from the Omarchy base layer.
unbind = SUPER ALT, S
unbind = SUPER SHIFT ALT, code:10
unbind = SUPER SHIFT ALT, code:11
unbind = SUPER SHIFT ALT, code:12
unbind = SUPER SHIFT ALT, code:13
unbind = SUPER SHIFT ALT, code:14
unbind = SUPER SHIFT ALT, code:15
unbind = SUPER SHIFT ALT, code:16
unbind = SUPER SHIFT ALT, code:17
unbind = SUPER SHIFT ALT, code:18
unbind = SUPER SHIFT ALT, code:19

# Gaming workspace.
unbind = SUPER, grave
unbind = SUPER SHIFT, grave
unbind = SUPER CTRL, grave
bindd = SUPER, grave, Gaming workspace, workspace, name:G
bindd = SUPER SHIFT, grave, Move window to gaming workspace, movetoworkspace, name:G
bindd = SUPER CTRL, grave, Steam, exec, setsid gtk-launch steam >/dev/null 2>&1
