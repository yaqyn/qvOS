# qvOS keybindings.
#
# Ownership:
# - Preserve every Omarchy binding unless qvOS replaces the exact modifier and key.
# - Keep each unbind next to its replacement and document the inherited action.
#
# Letter families:
# - Family One uses SUPER with optional SHIFT and CTRL.
# - Family Two adds ALT with optional SHIFT and CTRL.

# Letter bindings: applications and controls.

# X: terminal and tmux.
# Replaces Omarchy's Universal cut and Toggle dictation.
unbind = SUPER, X
unbind = SUPER CTRL, X
bindd = SUPER, X, Default terminal, exec, uwsm-app -- xdg-terminal-exec
bindd = SUPER SHIFT, X, Default terminal here, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here terminal
bindd = SUPER CTRL, X, Tmux, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/share/qvos/hyprland/qvos-tmux last
bindd = SUPER SHIFT CTRL, X, Tmux manager, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/share/qvos/hyprland/qvos-tmux manager

# Q: Proton.
bindd = SUPER, Q, Proton Mail, exec, omarchy-launch-webapp "https://mail.proton.me"
bindd = SUPER SHIFT, Q, Proton Drive, exec, omarchy-launch-webapp "https://drive.proton.me"
bindd = SUPER CTRL, Q, Proton Pass, exec, omarchy-launch-webapp "https://pass.proton.me"
bindd = SUPER SHIFT CTRL, Q, Proton Account, exec, omarchy-launch-webapp "https://account.proton.me"
bindd = SUPER ALT, Q, Proton Docs, exec, omarchy-launch-webapp "https://docs.proton.me"
bindd = SUPER SHIFT ALT, Q, Proton Meet, exec, omarchy-launch-webapp "https://meet.proton.me"
bindd = SUPER CTRL ALT, Q, Proton Calendar, exec, omarchy-launch-webapp "https://calendar.proton.me"
bindd = SUPER SHIFT CTRL ALT, Q, Proton Account Settings, exec, omarchy-launch-webapp "https://account.proton.me/u/1/dashboard"

# A: AI and focus left.
# Replaces Omarchy's Audio controls.
unbind = SUPER CTRL, A
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Focus left, movefocus, l
bindd = SUPER CTRL, A, Brave Ask, exec, omarchy-launch-webapp "https://search.brave.com/ask"
bindd = SUPER SHIFT CTRL, A, Codex YOLO here, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here codex-yolo

# W: inherited window control, focus up, and system controls.
# Omarchy retains SUPER+W for Close window and SUPER+CTRL+W for Wifi controls.
bindd = SUPER SHIFT, W, Focus up, movefocus, u
bindd = SUPER SHIFT CTRL, W, Audio controls, exec, omarchy-launch-audio

# D: development and focus right.
bindd = SUPER, D, Localhost, exec, ~/.local/share/qvos/hyprland/qvos-localhost-open
bindd = SUPER SHIFT, D, Focus right, movefocus, r
bindd = SUPER CTRL, D, Cloudflare, exec, omarchy-launch-webapp "https://dash.cloudflare.com"
bindd = SUPER SHIFT CTRL, D, GitHub, exec, omarchy-launch-webapp "https://github.com"

# S: communication and focus down.
# Replaces Omarchy's Toggle scratchpad and Share.
unbind = SUPER, S
unbind = SUPER CTRL, S
bindd = SUPER, S, Discord, exec, omarchy-launch-webapp "https://discord.com/app"
bindd = SUPER SHIFT, S, Focus down, movefocus, d
bindd = SUPER CTRL, S, Telegram, exec, omarchy-launch-webapp "https://web.telegram.org/"
bindd = SUPER SHIFT CTRL, S, WhatsApp, exec, omarchy-launch-webapp "https://web.whatsapp.com/"

# E: files and editor.
# Replaces Omarchy's Emoji picker.
unbind = SUPER CTRL, E
bindd = SUPER, E, Thunar, exec, uwsm-app -- ~/.local/share/qvos/defaults/qvos-launch-thunar "$HOME"
bindd = SUPER SHIFT, E, Thunar here, exec, uwsm-app -- ~/.local/share/qvos/defaults/qvos-launch-thunar "$(~/.local/share/qvos/hyprland/qvos-active-location)"
bindd = SUPER CTRL, E, Default editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT CTRL, E, Default editor here, exec, ~/.local/share/qvos/hyprland/qvos-launch-editor-here

# B: browser.
bindd = SUPER, B, Default browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, B, Private default browser, exec, omarchy-launch-browser --private

# Alt letter family: window placement and sizing.

# ALT+WASD: swap windows.
# SUPER+ALT+S replaces Omarchy's Move window to scratchpad.
unbind = SUPER ALT, S
bindd = SUPER ALT, A, Swap window left, swapwindow, l
bindd = SUPER ALT, W, Swap window up, swapwindow, u
bindd = SUPER ALT, D, Swap window right, swapwindow, r
bindd = SUPER ALT, S, Swap window down, swapwindow, d

# CTRL+ALT+WASD: resize windows.
# SUPER+CTRL+ALT+W replaces Omarchy's Show weather.
unbind = SUPER CTRL ALT, W
bindd = SUPER CTRL ALT, A, Resize window left, resizeactive, -100 0
bindd = SUPER CTRL ALT, W, Resize window up, resizeactive, 0 -100
bindd = SUPER CTRL ALT, D, Resize window right, resizeactive, 100 0
bindd = SUPER CTRL ALT, S, Resize window down, resizeactive, 0 100

# Non-letter controls.

# Special workspace.
# Replaces Omarchy's Theme background menu.
unbind = SUPER CTRL, SPACE
bindd = SUPER CTRL, SPACE, Toggle special workspace, togglespecialworkspace, scratchpad
bindd = SUPER CTRL ALT, SPACE, Move window in or out of special workspace, exec, ~/.local/share/qvos/hyprland/qvos-toggle-special-window

# Gaming workspace.
bindd = SUPER, grave, Gaming workspace, workspace, name:G
bindd = SUPER SHIFT, grave, Move window to gaming workspace, movetoworkspace, name:G
bindd = SUPER CTRL, grave, Steam, exec, setsid gtk-launch steam >/dev/null 2>&1
