# qvOS keybindings.
#
# Ownership:
# - Preserve every Omarchy binding unless qvOS replaces the exact modifier and key.
# - Keep each unbind next to its replacement and document the inherited action.
#
# Letter families:
# - Family One uses SUPER with optional SHIFT and CTRL.
# - Family Two adds ALT with optional SHIFT and CTRL.
# - Non-Alt families use SHIFT for secondary and CTRL for tertiary actions.

# Family index:
# - A: AI; B/Z: browsers; C: communication; D: development; E: files and office.
# - Q: Proton; R: Quran and reminders; S: window states; W: system controls.
# - X/Return: terminal and tmux.

# Letter bindings: applications and controls.

# X and Return: terminal and tmux.

# X family.
# Replaces Omarchy's Universal cut and Toggle dictation.
unbind = SUPER, X
unbind = SUPER CTRL, X
bindd = SUPER, X, Default terminal, exec, uwsm-app -- xdg-terminal-exec
bindd = SUPER SHIFT, X, Default terminal here, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here terminal
bindd = SUPER CTRL, X, Tmux, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/share/qvos/hyprland/qvos-tmux last
bindd = SUPER SHIFT CTRL, X, Tmux manager, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/share/qvos/hyprland/qvos-tmux manager

# Return family mirrors X.
bindd = SUPER, RETURN, Default terminal, exec, uwsm-app -- xdg-terminal-exec
bindd = SUPER SHIFT, RETURN, Default terminal here, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here terminal
bindd = SUPER CTRL, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/share/qvos/hyprland/qvos-tmux last
bindd = SUPER SHIFT CTRL, RETURN, Tmux manager, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/share/qvos/hyprland/qvos-tmux manager

# Q: Proton.
bindd = SUPER, Q, Proton Mail, exec, omarchy-launch-webapp "https://mail.proton.me"
bindd = SUPER SHIFT, Q, Proton Meet, exec, omarchy-launch-webapp "https://meet.proton.me"
bindd = SUPER CTRL, Q, Proton Drive, exec, omarchy-launch-webapp "https://drive.proton.me"
bindd = SUPER SHIFT CTRL, Q, Proton Docs, exec, omarchy-launch-webapp "https://docs.proton.me"
bindd = SUPER ALT, Q, Proton Pass, exec, omarchy-launch-webapp "https://pass.proton.me"
bindd = SUPER SHIFT ALT, Q, Proton Lumo, exec, omarchy-launch-webapp "https://lumo.proton.me"
bindd = SUPER CTRL ALT, Q, Proton Calendar, exec, omarchy-launch-webapp "https://calendar.proton.me"
bindd = SUPER SHIFT CTRL ALT, Q, Proton Account, exec, omarchy-launch-webapp "https://account.proton.me"

# A: AI.
# Replaces Omarchy's Audio controls.
unbind = SUPER CTRL, A
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Recraft, exec, omarchy-launch-webapp "https://www.recraft.ai/"
bindd = SUPER CTRL, A, Codex YOLO, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here codex-yolo "$HOME"
bindd = SUPER SHIFT CTRL, A, Codex YOLO here, exec, ~/.local/share/qvos/hyprland/qvos-launch-terminal-here codex-yolo

# C: communication and social.
# Replaces Omarchy's Capture menu. SUPER+C remains Universal copy.
unbind = SUPER CTRL, C
bindd = SUPER SHIFT, C, Telegram, exec, omarchy-launch-webapp "https://web.telegram.org/"
bindd = SUPER CTRL, C, WhatsApp, exec, omarchy-launch-webapp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, C, Discord, exec, omarchy-launch-webapp "https://discord.com/app"
bindd = SUPER ALT, C, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER CTRL ALT, C, Bluesky, exec, omarchy-launch-webapp "https://bsky.app/"

# R: Quran and reminders.
# Replaces Omarchy's Set, Show, and Clear reminder bindings.
unbind = SUPER CTRL, R
unbind = SUPER SHIFT CTRL, R
unbind = SUPER CTRL ALT, R
bindd = SUPER, R, Quran, exec, omarchy-launch-webapp "https://quran.com/"
bindd = SUPER SHIFT, R, Qirtaas, exec, omarchy-launch-webapp "https://qirtaas.io/dashboard"
bindd = SUPER CTRL, R, Qayyimental on Telegram, exec, uwsm-app -- Telegram -- "https://t.me/Qayyimental"
bindd = SUPER SHIFT CTRL, R, Elm Academy curriculum, exec, omarchy-launch-webapp "https://www.elm-academy.net/ar/%D8%A7%D9%84%D9%85%D9%86%D9%87%D8%AC"
bindd = SUPER ALT, R, Set reminder, exec, omarchy-menu reminder-set
bindd = SUPER CTRL ALT, R, Clear reminders, exec, omarchy-reminder clear
bindd = SUPER SHIFT CTRL ALT, R, Show reminders, exec, omarchy-reminder show

# W: inherited window and system controls.
# Omarchy retains SUPER+W for Close window.
# Moves Omarchy's Wifi controls to SUPER+SHIFT+W.
unbind = SUPER CTRL, W
bindd = SUPER SHIFT, W, Wifi controls, exec, omarchy-launch-wifi
bindd = SUPER CTRL, W, Audio controls, exec, omarchy-launch-audio
bindd = SUPER SHIFT CTRL, W, Bluetooth controls, exec, omarchy-launch-bluetooth

# D: development.
bindd = SUPER, D, GitHub, exec, omarchy-launch-webapp "https://github.com"
bindd = SUPER SHIFT, D, Cloudflare, exec, omarchy-launch-webapp "https://dash.cloudflare.com"
bindd = SUPER CTRL, D, Infisical, exec, omarchy-launch-webapp "https://app.infisical.com/"
bindd = SUPER SHIFT CTRL, D, Supabase, exec, omarchy-launch-webapp "https://supabase.com/dashboard"

# S: window states.
# Replaces Omarchy's Toggle scratchpad and Share.
unbind = SUPER, S
unbind = SUPER CTRL, S
bindd = SUPER, S, Toggle window floating/tiling, togglefloating,
bindd = SUPER SHIFT, S, Full screen, fullscreen, 0
bindd = SUPER CTRL, S, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER SHIFT CTRL, S, Pop window out (float & pin), exec, omarchy-hyprland-window-pop

# E: files and editor.
# Replaces Omarchy's Emoji picker.
unbind = SUPER CTRL, E
bindd = SUPER, E, Thunar, exec, uwsm-app -- ~/.local/share/qvos/thunar/launch "$HOME"
bindd = SUPER SHIFT, E, Thunar here, exec, uwsm-app -- ~/.local/share/qvos/thunar/launch "$(~/.local/share/qvos/hyprland/qvos-active-location)"
bindd = SUPER CTRL, E, Default editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT CTRL, E, Default editor here, exec, ~/.local/share/qvos/hyprland/qvos-launch-editor-here
bindd = SUPER ALT, E, Obsidian, exec, uwsm-app -- obsidian
bindd = SUPER SHIFT ALT, E, Standard Notes, exec, omarchy-launch-webapp "https://app.standardnotes.com/"
bindd = SUPER CTRL ALT, E, Google Workspace, exec, omarchy-launch-webapp "https://workspace.google.com/dashboard"
bindd = SUPER SHIFT CTRL ALT, E, Google Docs, exec, omarchy-launch-webapp "https://docs.google.com/"

# B: browser.
bindd = SUPER, B, Default browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, B, Private default browser, exec, omarchy-launch-browser --private

# Z: browsers, websites, localhost, and zoom.
# Replaces Omarchy's Zoom in and Reset zoom.
unbind = SUPER CTRL, Z
unbind = SUPER CTRL ALT, Z
bindd = SUPER, Z, Default browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, Z, Private default browser, exec, omarchy-launch-browser --private
bindd = SUPER CTRL, Z, Dev browser (Chromium), exec, uwsm-app -- chromium
bindd = SUPER SHIFT CTRL, Z, Localhost, exec, ~/.local/share/qvos/hyprland/qvos-localhost-open
bindd = SUPER ALT, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1
bindd = SUPER SHIFT CTRL ALT, Z, Open website, exec, ~/.local/share/qvos/hyprland/qvos-website-open

# Alt letter family: window focus, placement, and sizing.

# ALT+WASD: move focus.
# SUPER+ALT+S replaces Omarchy's Move window to scratchpad.
unbind = SUPER ALT, S
bindd = SUPER ALT, A, Focus left, movefocus, l
bindd = SUPER ALT, W, Focus up, movefocus, u
bindd = SUPER ALT, D, Focus right, movefocus, r
bindd = SUPER ALT, S, Focus down, movefocus, d

# SHIFT+ALT+WASD: resize windows.
bindd = SUPER SHIFT ALT, A, Resize window left, resizeactive, -100 0
bindd = SUPER SHIFT ALT, W, Resize window up, resizeactive, 0 -100
bindd = SUPER SHIFT ALT, D, Resize window right, resizeactive, 100 0
bindd = SUPER SHIFT ALT, S, Resize window down, resizeactive, 0 100

# CTRL+ALT+WASD: swap windows.
# SUPER+CTRL+ALT+W replaces Omarchy's Show weather.
unbind = SUPER CTRL ALT, W
bindd = SUPER CTRL ALT, A, Swap window left, swapwindow, l
bindd = SUPER CTRL ALT, W, Swap window up, swapwindow, u
bindd = SUPER CTRL ALT, D, Swap window right, swapwindow, r
bindd = SUPER CTRL ALT, S, Swap window down, swapwindow, d

# SHIFT+CTRL+ALT+WASD: move the workspace between monitors.
bindd = SUPER SHIFT CTRL ALT, A, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT CTRL ALT, W, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT CTRL ALT, D, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT CTRL ALT, S, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Arrow family: the same spatial actions without ALT.
# SUPER+ARROWS focus remains Omarchy-owned.

# SHIFT+ARROWS: resize windows.
# Replaces Omarchy's directional window swapping.
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, DOWN
bindd = SUPER SHIFT, LEFT, Resize window left, resizeactive, -100 0
bindd = SUPER SHIFT, UP, Resize window up, resizeactive, 0 -100
bindd = SUPER SHIFT, RIGHT, Resize window right, resizeactive, 100 0
bindd = SUPER SHIFT, DOWN, Resize window down, resizeactive, 0 100

# CTRL+ARROWS: swap windows.
# SUPER+CTRL+LEFT/RIGHT replace Omarchy's grouped-window focus.
unbind = SUPER CTRL, LEFT
unbind = SUPER CTRL, RIGHT
bindd = SUPER CTRL, LEFT, Swap window left, swapwindow, l
bindd = SUPER CTRL, UP, Swap window up, swapwindow, u
bindd = SUPER CTRL, RIGHT, Swap window right, swapwindow, r
bindd = SUPER CTRL, DOWN, Swap window down, swapwindow, d

# SHIFT+CTRL+ARROWS: move the workspace between monitors.
bindd = SUPER SHIFT CTRL, LEFT, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT CTRL, UP, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT CTRL, RIGHT, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT CTRL, DOWN, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# ALT+ARROWS remain Omarchy-owned.

# Non-letter controls.

# Capture.
bindd = SUPER SHIFT, PRINT, Capture menu, exec, omarchy-menu capture

# Special workspace.
# Replaces Omarchy's Theme background menu.
unbind = SUPER CTRL, SPACE
bindd = SUPER CTRL, SPACE, Toggle special workspace, togglespecialworkspace, scratchpad
bindd = SUPER CTRL ALT, SPACE, Move window in or out of special workspace, exec, ~/.local/share/qvos/hyprland/qvos-toggle-special-window

# Gaming workspace.
bindd = SUPER, grave, Gaming workspace, workspace, name:G
bindd = SUPER SHIFT, grave, Move window to gaming workspace, movetoworkspace, name:G
bindd = SUPER CTRL, grave, Steam, exec, setsid gtk-launch steam >/dev/null 2>&1
