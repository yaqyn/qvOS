# qvOS keybindings.
#
# Ownership:
# - This is the complete active binding source; no inherited binding layer exists.
# - Keep every modifier and key pair unique unless press/release semantics require both.
#
# Letter families:
# - Family One uses SUPER with optional SHIFT and CTRL.
# - Family Two adds ALT with optional SHIFT and CTRL.
# - Ease descends through SUPER, SHIFT, CTRL, SHIFT+CTRL, ALT, CTRL+ALT,
#   SHIFT+ALT, and SHIFT+CTRL+ALT.
# - CTRL modifies the action beside it; SHIFT introduces the next major action.

# Family index:
# - A: AI; B/Z: browsers; C: communication; D: development; E: files and office.
# - F/S: window states and special workspace; Q: Proton; R: Quran and reminders.
# - W: system controls.
# - X/Return: terminal and tmux.

# Letter bindings: applications and controls.

# X and Return: terminal and tmux.

# X family.
bindd = SUPER, X, Default terminal, exec, uwsm-app -- xdg-terminal-exec
bindd = SUPER SHIFT, X, Tmux, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/lib/qvos/tmux/qvos-tmux last
bindd = SUPER CTRL, X, Default terminal here, exec, ~/.local/lib/qvos/desktop/context/qvos-launch-terminal-here terminal
bindd = SUPER SHIFT CTRL, X, Tmux manager, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/lib/qvos/tmux/qvos-tmux manager

# Return family mirrors X.
bindd = SUPER, RETURN, Default terminal, exec, uwsm-app -- xdg-terminal-exec
bindd = SUPER SHIFT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/lib/qvos/tmux/qvos-tmux last
bindd = SUPER CTRL, RETURN, Default terminal here, exec, ~/.local/lib/qvos/desktop/context/qvos-launch-terminal-here terminal
bindd = SUPER SHIFT CTRL, RETURN, Tmux manager, exec, uwsm-app -- xdg-terminal-exec --app-id=org.qvos.tmux-manager --title="qvOS tmux" ~/.local/lib/qvos/tmux/qvos-tmux manager

# Q: Proton.
bindd = SUPER, Q, Proton Mail, exec, omarchy-launch-webapp "https://mail.proton.me"
bindd = SUPER SHIFT, Q, Proton Drive, exec, omarchy-launch-webapp "https://drive.proton.me"
bindd = SUPER CTRL, Q, Proton Meet, exec, omarchy-launch-webapp "https://meet.proton.me"
bindd = SUPER SHIFT CTRL, Q, Proton Docs, exec, omarchy-launch-webapp "https://docs.proton.me"
bindd = SUPER ALT, Q, Proton Pass, exec, omarchy-launch-webapp "https://pass.proton.me"
bindd = SUPER SHIFT ALT, Q, Proton Lumo, exec, omarchy-launch-webapp "https://lumo.proton.me"
bindd = SUPER CTRL ALT, Q, Proton Calendar, exec, omarchy-launch-webapp "https://calendar.proton.me"
bindd = SUPER SHIFT CTRL ALT, Q, Proton Account, exec, omarchy-launch-webapp "https://account.proton.me"

# A: AI.
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Codex YOLO, exec, ~/.local/lib/qvos/desktop/context/qvos-launch-terminal-here codex-yolo "$HOME"
bindd = SUPER CTRL, A, Recraft, exec, omarchy-launch-webapp "https://www.recraft.ai/"
bindd = SUPER SHIFT CTRL, A, Codex YOLO here, exec, ~/.local/lib/qvos/desktop/context/qvos-launch-terminal-here codex-yolo

# C: communication and social.
# SUPER+C remains Universal copy.
bindd = SUPER SHIFT, C, WhatsApp, exec, omarchy-launch-webapp "https://web.whatsapp.com/"
bindd = SUPER CTRL, C, Telegram, exec, omarchy-launch-webapp "https://web.telegram.org/"
bindd = SUPER SHIFT CTRL, C, Discord, exec, omarchy-launch-webapp "https://discord.com/app"
bindd = SUPER ALT, C, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER CTRL ALT, C, Bluesky, exec, omarchy-launch-webapp "https://bsky.app/"

# R: Quran and reminders.
bindd = SUPER, R, Quran, exec, omarchy-launch-webapp "https://quran.com/"
bindd = SUPER SHIFT, R, Qayyimental on Telegram, exec, uwsm-app -- Telegram -- "https://t.me/Qayyimental"
bindd = SUPER CTRL, R, Qirtaas, exec, omarchy-launch-webapp "https://qirtaas.io/dashboard"
bindd = SUPER SHIFT CTRL, R, Elm Academy curriculum, exec, omarchy-launch-webapp "https://www.elm-academy.net/ar/%D8%A7%D9%84%D9%85%D9%86%D9%87%D8%AC"
bindd = SUPER ALT, R, Set reminder, exec, omarchy-menu reminder-set
bindd = SUPER CTRL ALT, R, Clear reminders, exec, omarchy-reminder clear
bindd = SUPER SHIFT CTRL ALT, R, Show reminders, exec, omarchy-reminder show

# W: window and system controls.
# SUPER+W closes the active window; SUPER+CTRL+W opens Wi-Fi controls.
bindd = SUPER SHIFT, W, Audio controls, exec, omarchy-launch-audio
bindd = SUPER SHIFT CTRL, W, Bluetooth controls, exec, omarchy-launch-bluetooth

# D: development.
bindd = SUPER, D, GitHub, exec, omarchy-launch-webapp "https://github.com"
bindd = SUPER SHIFT, D, Infisical, exec, omarchy-launch-webapp "https://app.infisical.com/"
bindd = SUPER CTRL, D, Cloudflare, exec, omarchy-launch-webapp "https://dash.cloudflare.com"
bindd = SUPER SHIFT CTRL, D, Supabase, exec, omarchy-launch-webapp "https://supabase.com/dashboard"

# F/S: window states and special workspace.
# SUPER+F is full screen and SUPER+S is the special workspace.
bindd = SUPER SHIFT, F, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER CTRL, F, Toggle window floating/tiling, togglefloating,
bindd = SUPER SHIFT CTRL, F, Pop window out (float & pin), exec, omarchy-hyprland-window-pop
bindd = SUPER CTRL, S, Move window in or out of special workspace, exec, ~/.local/lib/qvos/desktop/hyprland/qvos-toggle-special-window

# E: files and editor.
bindd = SUPER, E, Thunar, exec, uwsm-app -- ~/.local/lib/qvos/thunar/launch "$HOME"
bindd = SUPER SHIFT, E, Default editor, exec, omarchy-launch-editor
bindd = SUPER CTRL, E, Thunar here, exec, uwsm-app -- ~/.local/lib/qvos/thunar/launch "$(~/.local/lib/qvos/desktop/context/qvos-active-location)"
bindd = SUPER SHIFT CTRL, E, Default editor here, exec, ~/.local/lib/qvos/desktop/context/qvos-launch-editor-here
bindd = SUPER ALT, E, Obsidian, exec, uwsm-app -- obsidian
bindd = SUPER CTRL ALT, E, Standard Notes, exec, omarchy-launch-webapp "https://app.standardnotes.com/"
bindd = SUPER SHIFT ALT, E, Google Workspace, exec, omarchy-launch-webapp "https://workspace.google.com/dashboard"
bindd = SUPER SHIFT CTRL ALT, E, Google Docs, exec, omarchy-launch-webapp "https://docs.google.com/"

# B: browser.
bindd = SUPER, B, Default browser, exec, omarchy-launch-browser
bindd = SUPER CTRL, B, Private default browser, exec, omarchy-launch-browser --private

# Z: browsers, websites, localhost, and zoom.
bindd = SUPER, Z, Default browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, Z, Dev browser (Chromium), exec, uwsm-app -- chromium
bindd = SUPER CTRL, Z, Private default browser, exec, omarchy-launch-browser --private
bindd = SUPER SHIFT CTRL, Z, Localhost, exec, ~/.local/lib/qvos/desktop/web/qvos-localhost-open
bindd = SUPER ALT, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1
bindd = SUPER SHIFT CTRL ALT, Z, Open website, exec, ~/.local/lib/qvos/desktop/web/qvos-website-open

# Alt letter family: window focus, placement, and sizing.

# ALT+WASD: move focus.
bindd = SUPER ALT, A, Focus left, movefocus, l
bindd = SUPER ALT, W, Focus up, movefocus, u
bindd = SUPER ALT, D, Focus right, movefocus, r
bindd = SUPER ALT, S, Focus down, movefocus, d

# CTRL+ALT+WASD: resize windows.
bindd = SUPER CTRL ALT, A, Resize window left, resizeactive, -100 0
bindd = SUPER CTRL ALT, W, Resize window up, resizeactive, 0 -100
bindd = SUPER CTRL ALT, D, Resize window right, resizeactive, 100 0
bindd = SUPER CTRL ALT, S, Resize window down, resizeactive, 0 100

# SHIFT+ALT+WASD: swap windows.
bindd = SUPER SHIFT ALT, A, Swap window left, swapwindow, l
bindd = SUPER SHIFT ALT, W, Swap window up, swapwindow, u
bindd = SUPER SHIFT ALT, D, Swap window right, swapwindow, r
bindd = SUPER SHIFT ALT, S, Swap window down, swapwindow, d

# SHIFT+CTRL+ALT+WASD: move the workspace between monitors.
bindd = SUPER SHIFT CTRL ALT, A, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT CTRL ALT, W, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT CTRL ALT, D, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT CTRL ALT, S, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Arrow family: the same spatial actions without ALT.

# CTRL+ARROWS: resize windows.
bindd = SUPER CTRL, LEFT, Resize window left, resizeactive, -100 0
bindd = SUPER CTRL, UP, Resize window up, resizeactive, 0 -100
bindd = SUPER CTRL, RIGHT, Resize window right, resizeactive, 100 0
bindd = SUPER CTRL, DOWN, Resize window down, resizeactive, 0 100

# SHIFT+CTRL+ARROWS: move the workspace between monitors.
bindd = SUPER SHIFT CTRL, LEFT, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT CTRL, UP, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT CTRL, RIGHT, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT CTRL, DOWN, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Non-letter controls.

# Shared qvOS menu, opened on Apps.
bindd = SUPER, SPACE, qvOS apps, exec, omarchy-menu apps

# Capture.
bindd = SUPER SHIFT, PRINT, Capture menu, exec, omarchy-menu capture

# Gaming workspace.
bindd = SUPER, grave, Gaming workspace, workspace, name:G
bindd = SUPER SHIFT, grave, Move window to gaming workspace, movetoworkspace, name:G
bindd = SUPER CTRL, grave, Steam, exec, setsid gtk-launch steam >/dev/null 2>&1

# Window and workspace controls.

# Window lifecycle and layout.
bindd = SUPER, W, Close window, killactive,
bindd = CTRL ALT, DELETE, Close all windows, exec, omarchy-hyprland-window-close-all
bindd = SUPER, J, Toggle window split, layoutmsg, togglesplit
bindd = SUPER, P, Pseudo window, pseudo, # dwindle
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER ALT, F, Full width, fullscreen, 1
bindd = SUPER, L, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle

# Focus with SUPER + arrow keys.
bindd = SUPER, LEFT, Focus on left window, movefocus, l
bindd = SUPER, RIGHT, Focus on right window, movefocus, r
bindd = SUPER, UP, Focus on above window, movefocus, u
bindd = SUPER, DOWN, Focus on below window, movefocus, d

# Switch workspaces with SUPER + [1-9; 0].
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1
bindd = SUPER, code:11, Switch to workspace 2, workspace, 2
bindd = SUPER, code:12, Switch to workspace 3, workspace, 3
bindd = SUPER, code:13, Switch to workspace 4, workspace, 4
bindd = SUPER, code:14, Switch to workspace 5, workspace, 5
bindd = SUPER, code:15, Switch to workspace 6, workspace, 6
bindd = SUPER, code:16, Switch to workspace 7, workspace, 7
bindd = SUPER, code:17, Switch to workspace 8, workspace, 8
bindd = SUPER, code:18, Switch to workspace 9, workspace, 9
bindd = SUPER, code:19, Switch to workspace 10, workspace, 10

# Move the active window with SUPER + SHIFT + [1-9; 0].
bindd = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10

# Move the active window silently with SUPER + SHIFT + ALT + [1-9; 0].
bindd = SUPER SHIFT ALT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10

# Special workspace and workspace history.
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Former workspace, workspace, previous

# Move workspaces between monitors.
bindd = SUPER SHIFT ALT, LEFT, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT ALT, RIGHT, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT ALT, UP, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT ALT, DOWN, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Swap adjacent windows.
bindd = SUPER SHIFT, LEFT, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d

# Cycle windows and monitors.
bindd = ALT, TAB, Focus on next window, exec, hyprctl dispatch cyclenext && hyprctl dispatch bringactivetotop
bindd = ALT SHIFT, TAB, Focus on previous window, exec, hyprctl dispatch cyclenext prev && hyprctl dispatch bringactivetotop
bindd = CTRL ALT, TAB, Focus on next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, TAB, Focus on previous monitor, focusmonitor, -1

# Directional size adjustments.
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0 # - key
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0 # = key
bindd = SUPER SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Expand window down, resizeactive, 0 100

# Mouse window and workspace control.
bindd = SUPER, mouse_down, Scroll active workspace forward, workspace, e+1
bindd = SUPER, mouse_up, Scroll active workspace backward, workspace, e-1
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# Window groups.
bindd = SUPER, G, Toggle window grouping, togglegroup
bindd = SUPER ALT, G, Move active window out of group, moveoutofgroup
bindd = SUPER ALT, LEFT, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Move window to group on right, moveintogroup, r
bindd = SUPER ALT, UP, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, DOWN, Move window to group on bottom, moveintogroup, d
bindd = SUPER ALT, TAB, Next window in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Previous window in group, changegroupactive, b
bindd = SUPER ALT, mouse_down, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_up, Previous window in group, changegroupactive, b
bindd = SUPER ALT, code:10, Switch to group window 1, changegroupactive, 1
bindd = SUPER ALT, code:11, Switch to group window 2, changegroupactive, 2
bindd = SUPER ALT, code:12, Switch to group window 3, changegroupactive, 3
bindd = SUPER ALT, code:13, Switch to group window 4, changegroupactive, 4
bindd = SUPER ALT, code:14, Switch to group window 5, changegroupactive, 5

# Monitor scaling.
bindd = SUPER, code:61, Cycle monitor scaling, exec, omarchy-hyprland-monitor-scaling-cycle
bindd = SUPER ALT, code:61, Cycle monitor scaling backwards, exec, omarchy-hyprland-monitor-scaling-cycle --reverse

# Clipboard.
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert, activewindow
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert, activewindow
bindd = SUPER CTRL, V, Clipboard manager, exec, omarchy-launch-walker -m clipboard

# Menus and hardware keys.
bindd = SUPER CTRL, O, Toggle menu, exec, omarchy-menu toggle
bindd = SUPER CTRL, H, Hardware menu, exec, omarchy-menu hardware
bindd = SUPER ALT, SPACE, qvOS menu, exec, omarchy-menu
bindd = SUPER SHIFT, code:201, qvOS menu, exec, omarchy-menu
bindd = SUPER, ESCAPE, System menu, exec, omarchy-menu system
bindld = , XF86PowerOff, Power menu, exec, omarchy-menu system
bindd = SUPER, K, Show key bindings, exec, omarchy-menu-keybindings
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Appearance.
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, omarchy-toggle-waybar
bindd = SUPER CTRL, SPACE, Theme background menu, exec, omarchy-menu background
bindd = SUPER SHIFT CTRL, SPACE, Theme menu, exec, omarchy-menu theme
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, omarchy-hyprland-window-transparency-toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, omarchy-hyprland-window-gaps-toggle
bindd = SUPER CTRL, BACKSPACE, Toggle single-window square aspect, exec, omarchy-hyprland-window-single-square-aspect-toggle

# Notifications.
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, omarchy-toggle-notification-silencing
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# System toggles.
bindd = SUPER CTRL, I, Toggle locking on idle, exec, omarchy-toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, omarchy-toggle-nightlight
bindd = SUPER CTRL, Delete, Toggle laptop display, exec, omarchy-hyprland-monitor-internal toggle
bindd = SUPER CTRL ALT, Delete, Toggle laptop display mirroring, exec, omarchy-hyprland-monitor-internal-mirror toggle
bindl = , switch:on:Lid Switch, exec, omarchy-hw-external-monitors && omarchy-hyprland-monitor-internal off
bindl = , switch:off:Lid Switch, exec, omarchy-hyprland-monitor-internal on

# Capture and conversion.
bindd = , PRINT, Screenshot, exec, omarchy-capture-screenshot
bindd = ALT, PRINT, Screenrecording, exec, omarchy-menu screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER CTRL, PRINT, Extract text (OCR) from screenshot, exec, omarchy-capture-text-extraction
bindd = SUPER CTRL, PERIOD, Transcode, exec, omarchy-transcode

# Information and control panels.
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "    $(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send -u low "$(omarchy-battery-status)"
bindd = SUPER CTRL, W, Wifi controls, exec, omarchy-launch-wifi
bindd = SUPER CTRL, T, Activity, exec, omarchy-launch-tui btop

# Dictation push-to-talk.
bindd = , F9, Start dictation (push-to-talk), exec, voxtype record start
binddr = , F9, Stop dictation (push-to-talk), exec, voxtype record stop

# Lock system.
bindd = SUPER CTRL, L, Lock system, exec, omarchy-system-lock

