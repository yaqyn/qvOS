general {
    lock_cmd = qv-system-lock                              # lock screen and 1password
    before_sleep_cmd = QVOS_LOCK_ONLY=true qv-system-lock # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && qv-system-wake            # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = pidof hyprlock || ~/.local/lib/qvos/bin/qvos-launch-screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = qv-system-lock
    on-resume = qv-system-wake
}

# Suspend after 30 locked minutes when protected work is idle
listener {
    timeout = 1800
    on-timeout = ~/.local/lib/qvos/bin/qv-system-suspend-if-safe --watch
}
