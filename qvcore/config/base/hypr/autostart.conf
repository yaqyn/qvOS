# qvOS session services.
exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- mako
exec-once = ! qv-toggle-enabled waybar-off && qv-restart-waybar
exec-once = uwsm-app -- fcitx5 --disable notificationitem
exec-once = qv-theme-bg-restore
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = qv-first-run
exec-once = qv-powerprofiles-init
exec-once = qv-restart-monitor-watch

# Make the complete session environment available to slow-starting services.
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

# Run user hooks only after the base desktop has started.
exec-once = sleep 2 && qv-hook post-boot
