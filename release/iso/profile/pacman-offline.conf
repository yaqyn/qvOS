#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives
[options]
HoldPkg     = pacman glibc
Architecture = auto
NoProgressBar
ParallelDownloads = 5

# Require trusted signatures for repository packages and direct local package
# files. The native image builder retains every detached package signature.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Required

[offline]
SigLevel = Required DatabaseOptional
Server = file:///var/cache/qvos/mirror/offline/
