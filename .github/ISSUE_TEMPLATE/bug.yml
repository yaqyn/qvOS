name: Bug
description: Report a validated bug -- NOT FOR SUPPORT REQUESTS
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible qvOS bugs. Use a blank issue for questions or proposals.

  - type: input
    id: system-details
    attributes:
      label: System details
      placeholder: e.g. AMD 9950X, NVIDIA 5090, qvOS 1.0.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What's wrong?
      description: Describe the issue, include steps to reproduce it, and attach the private-safe output of `qv debug` when relevant.
    validations:
      required: true
