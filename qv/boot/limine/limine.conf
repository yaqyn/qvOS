### Read more at config document: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
timeout: 5
default_entry: 2
remember_last_entry: no
interface_branding:
interface_help_hidden: yes
interface_help_color: 000000
interface_help_color_bright: 000000
editor_highlighting: no
hash_mismatch_panic: no

term_background: 000000
backdrop: 000000

# Terminal colors (qvOS grayscale-only boot palette; cyan hides entry comments)
term_palette: 000000;3a3a3a;5a5a5a;707070;8a8a8a;a0a0a0;000000;d6d6d6
term_palette_bright: 111111;4a4a4a;6a6a6a;808080;9a9a9a;b0b0b0;c8c8c8;e0e0e0

# Text colors
term_foreground: a0a0a0
term_foreground_bright: b8b8b8
term_background_bright: 000000
