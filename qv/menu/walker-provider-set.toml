# qvOS menu provider set start
[providers.sets.qvos-menu]
default = ["menus:qvosMenu"]
empty = ["menus:qvosMenu"]

[[providers.actions."menus:qvosMenu"]]
action = "activate"
default = true
bind = "Return"
after = "Close"

# Wait for Elephant's activation acknowledgement before repeating the query.
[[providers.actions."menus:qvosMenu"]]
action = "show_apps"
default = true
bind = "Return"
after = "AsyncReload"

[[providers.actions."menus:qvosMenu"]]
action = "show_menu"
default = true
bind = "Return"
after = "AsyncReload"

[[providers.actions."menus:qvosMenu"]]
action = "toggle"
label = "Apps / Menu"
bind = "Tab"
after = "AsyncReload"
# qvOS menu provider set end
